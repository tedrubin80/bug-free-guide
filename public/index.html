<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      transition: background 0.3s;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .profile {
      text-align: center;
      margin-bottom: 30px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid rgba(255, 255, 255, 0.3);
    }

    .avatar-placeholder {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 40px;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .profile-bio {
      font-size: 14px;
      opacity: 0.9;
      max-width: 400px;
      margin: 0 auto;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: block;
      padding: 16px 24px;
      border-radius: 12px;
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .link-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .link-item:active {
      transform: translateY(0);
    }

    /* Drag and drop styles */
    .link-item.draggable {
      cursor: grab;
    }

    .link-item.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }

    .link-item.drag-over {
      border: 2px dashed rgba(255, 255, 255, 0.5);
    }

    .drag-mode-indicator {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      display: none;
      z-index: 100;
    }

    .drag-mode-indicator.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .link-icon {
      margin-right: 8px;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      opacity: 0.7;
      font-size: 12px;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 40px;
      opacity: 0.7;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      opacity: 0.7;
    }

    /* Icon styles */
    .icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 8px;
      vertical-align: middle;
    }

    /* Social icons using unicode/emoji */
    .icon-github::before { content: ''; }
    .icon-twitter::before { content: ''; }
    .icon-linkedin::before { content: ''; }
    .icon-instagram::before { content: ''; }
    .icon-youtube::before { content: ''; }
    .icon-email::before { content: ''; }
    .icon-website::before { content: ''; }

    @media (max-width: 480px) {
      body {
        padding: 30px 15px;
      }

      .profile-name {
        font-size: 20px;
      }

      .link-item {
        padding: 14px 20px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile" id="profile">
      <div class="loading">Loading...</div>
    </div>

    <div class="links-container" id="linksContainer">
      <div class="loading">Loading links...</div>
    </div>

    <div class="footer">
      <a href="/admin">Admin</a>
    </div>
  </div>

  <div class="drag-mode-indicator" id="dragIndicator">
    Drag to reorder - Release to save
  </div>

  <script>
    let links = [];
    let profile = {};
    let isDragMode = false;
    let draggedItem = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      await Promise.all([loadProfile(), loadLinks()]);
    });

    // Load profile
    async function loadProfile() {
      try {
        const response = await fetch('/api/profile');
        profile = await response.json();
        renderProfile();
      } catch (error) {
        console.error('Error loading profile:', error);
      }
    }

    // Render profile
    function renderProfile() {
      const container = document.getElementById('profile');

      // Set page title
      document.title = profile.name || 'My Links';

      // Set body background
      document.body.style.background = profile.background_color || '#667eea';
      document.body.style.color = profile.text_color || '#ffffff';

      container.innerHTML = `
        ${profile.avatar_url
          ? `<img src="${escapeHtml(profile.avatar_url)}" alt="Avatar" class="avatar" onerror="this.style.display='none'">`
          : `<div class="avatar-placeholder">${(profile.name || 'M')[0].toUpperCase()}</div>`
        }
        <h1 class="profile-name">${escapeHtml(profile.name || 'My Links')}</h1>
        <p class="profile-bio">${escapeHtml(profile.bio || '')}</p>
      `;
    }

    // Load links
    async function loadLinks() {
      try {
        const response = await fetch('/api/links');
        links = await response.json();
        renderLinks();
      } catch (error) {
        console.error('Error loading links:', error);
        document.getElementById('linksContainer').innerHTML = '<div class="empty-state">Error loading links</div>';
      }
    }

    // Render links
    function renderLinks() {
      const container = document.getElementById('linksContainer');

      if (links.length === 0) {
        container.innerHTML = '<div class="empty-state">No links yet</div>';
        return;
      }

      container.innerHTML = links.map(link => `
        <a href="${escapeHtml(link.url)}"
           class="link-item draggable"
           data-id="${link.id}"
           style="background-color: ${link.background_color}; color: ${link.text_color};"
           target="_blank"
           rel="noopener noreferrer"
           onclick="trackClick(event, ${link.id})">
          ${getIconHtml(link.icon)}${escapeHtml(link.title)}
        </a>
      `).join('');

      setupDragAndDrop();
    }

    // Get icon HTML
    function getIconHtml(icon) {
      if (!icon) return '';

        twitter: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>',
        linkedin: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',

        youtube: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
        email: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>',
        website: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'
      };

      return iconMap[icon.toLowerCase()] || '';
    }

    // Track click
    async function trackClick(event, id) {
      // Don't prevent default - let the link work
      try {
        await fetch(`/api/links/${id}/click`, { method: 'POST' });
      } catch (error) {
        console.error('Error tracking click:', error);
      }
    }

    // Setup drag and drop
    function setupDragAndDrop() {
      const items = document.querySelectorAll('.link-item.draggable');

      items.forEach(item => {
        item.addEventListener('dragstart', handleDragStart);
        item.addEventListener('dragend', handleDragEnd);
        item.addEventListener('dragover', handleDragOver);
        item.addEventListener('dragleave', handleDragLeave);
        item.addEventListener('drop', handleDrop);

        // Make items draggable
        item.setAttribute('draggable', 'true');
      });
    }

    function handleDragStart(e) {
      draggedItem = this;
      this.classList.add('dragging');
      document.getElementById('dragIndicator').classList.add('active');

      // Required for Firefox
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', this.innerHTML);
    }

    function handleDragEnd(e) {
      this.classList.remove('dragging');
      document.querySelectorAll('.link-item').forEach(item => item.classList.remove('drag-over'));
      document.getElementById('dragIndicator').classList.remove('active');

      // Save the new order
      saveOrder();
    }

    function handleDragOver(e) {
      e.preventDefault();
      if (this !== draggedItem) {
        this.classList.add('drag-over');
      }
    }

    function handleDragLeave(e) {
      this.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();

      if (this !== draggedItem) {
        const container = document.getElementById('linksContainer');
        const items = [...container.querySelectorAll('.link-item')];
        const draggedIndex = items.indexOf(draggedItem);
        const dropIndex = items.indexOf(this);

        if (draggedIndex < dropIndex) {
          this.after(draggedItem);
        } else {
          this.before(draggedItem);
        }
      }

      this.classList.remove('drag-over');
    }

    // Save order to server
    async function saveOrder() {
      const items = document.querySelectorAll('.link-item');
      const orders = [...items].map((item, index) => ({
        id: parseInt(item.dataset.id),
        sort_order: index
      }));

      try {
        await fetch('/api/links/reorder', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orders })
        });

        // Update local links array
        orders.forEach(order => {
          const link = links.find(l => l.id === order.id);
          if (link) link.sort_order = order.sort_order;
        });
      } catch (error) {
        console.error('Error saving order:', error);
      }
    }

    // Escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
